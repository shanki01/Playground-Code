<!DOCTYPE html>
<html lang="en">
<head>
    <title>Splat Dashboard</title>

    <meta charset="UTF-8">
    <meta content="width=device-width,initial-scale=1.0" name="viewport">

    <link href="https://pyscript.net/releases/2025.2.1/core.css" rel="stylesheet">
    <script src="https://pyscript.net/releases/2025.2.1/core.js" type="module"></script>
    <link href="style.css" rel="stylesheet">
</head>
<body>
<main class="dashboard">
    <h1>Splat Dashboard</h1>

    <section class="connection-controls">
        <button id="ble_connect">Connect</button>
        <button id="ble_disconnect">Disconnect</button>

        <span class="tooltip">ⓘ
                <span class="tooltiptext">
                    Bluetooth only works in Chrome, Edge, or Opera.
                    <a href="https://developer.mozilla.org/en-US/docs/Web/API/Web_Bluetooth_API" target="_blank">More info</a>
                </span>
            </span>
    </section>

    <section class="status-controls">
        <button id="battery">Battery</button>
        <button id="switches">Switch Status</button>
        <!--             <button id="id">ID</button>  -->
        <br>
        Splat Response:
        <div id='ble_answer' style='color:darkblue;'>None</div>
    </section>

    <section class="led-control-section">
        <h2> LED Control</h2>
        <div class="board-container">
            <svg id="splat" viewBox="0 0 600 600">
                <g transform="scale(3.8)">

                          sodipodi:nodetypes="ssssssszsszssssssssssssssscssssszs"
                          style="fill:rgba(255,255,255,0);fill-opacity:1;fill-rule:evenodd;stroke:#272727;stroke-width:0.4;stroke-linecap:round;stroke-linejoin:round"
                          xmlns="http://www.w3.org/2000/svg"
                          xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"/>
                </g>
                <circle id="switch-2" cx="20" cy="20" r="20" fill="gray" />
                <circle id="switch-1" cx="580" cy="20" r="20" fill="gray" />
                <circle id="switch-4" cx="20" cy="580" r="20" fill="gray" />
                <circle id="switch-3" cx="580" cy="580" r="20" fill="gray" />
            </svg>
        </div>
        <div class="led-actions">
            <button id="update-led-btn">Update</button>
            <button id="all-off-btn">Turn All Off</button>
            <br> <br>
        </div>
    </section>

    <section class="sound-control">
        <h2>Sound Control</h2>
        <div class="volume-controls">
            <input type="range" id="volumeSlider" min="0" max="255" value="255">
            <button id="mute" onclick="soundOff()">Mute</button>
        </div>

        <div class="sond-player">
            <label for="sound-index"> Sound #:</label>
            <input type="number" id="sound-index" min="0" max="255">
            <button id="play-sound">Play</button><br>
            <p>
                0: Splat <br>
                1: Chime <br>
                2: Buzz 1 <br>
                3: Buzz 2 <br>
                4: Doorbell <br>
                5: Cymbol <br>
                6: Fart <br>
                7: Pop <br>
                8: Zoom <br>
                ... <br>
                79: Backing up <br>
            </p>
        </div>
    </section>

    <section class="midi-controls">
        <h2>MIDI Control</h2>
        <div class="midi-controls-form">
            <div class="form-row">
                <label for="note">Note:</label>
                <input type="text" id="note">
            </div>
            <div class="form-row">
                <label for="octave">Octave:</label>
                <input type="number" id="octave" value="4">
            </div>
            <div class="form-row">
                <label for="velocity">Velocity:</label>
                <input type="number" id="velocity" value="100">
            </div>
            <div class="form-row">
                <label for="instrument">Instrument:</label>
                <input type="number" id="instrument" value="0">
            </div>
        </div>
        <div>
            <button id="note-on">Note On</button>
            <button id="note-off">Note Off</button>
            <button id="all-midi-off">All MIDI Off</button>
        </div>
    </section>

    <section class="debug">
        <h2>Debugging</h2>
        <button id="test-click">Test</button>
    </section>
    <section class="led-control-section">
        <script config="./config.toml" src="./main.py" terminal type="py"></script>
    </section>

</main>

<script>
    function soundOff() {
        document.getElementById('volumeSlider').value = 0;
    }

    const positions = [
        [201, 352],
        [38, 381],
        [148, 295],
        [78, 205],
        [191, 208],
        [185, 29],
        [304, 187],
        [511, 70],
        [390, 238],
        [557, 288],
        [415, 341],
        [463, 518],
        [300, 390],
        [227, 526],
    ];

    positions.forEach((pos, index) => {
        const div = document.createElement('div');
        div.className = 'led-control';
        div.style.left = `${pos[0]}px`;
        div.style.top = `${pos[1]}px`;

        const colorInput = document.createElement('input');
        colorInput.type = 'color';
        colorInput.value = '#000000';
        colorInput.id = `led-${index}`;

        const offButton = document.createElement('button');
        offButton.className = 'off-btn';
        offButton.textContent = 'Off';
        offButton.id = `led-off-${index}`;
        offButton.onclick = () => {
            colorInput.value = '#000000';
            // Hook in hardware logic here if needed
        };

        div.appendChild(colorInput);
        div.appendChild(offButton);
        document.querySelector('.board-container').appendChild(div);
    });

    document.getElementById('all-off-btn').addEventListener('click', () => {
        for (let i = 0; i < 14; i++) {
            const led = document.getElementById(`led-${i}`);
            if (led) led.value = '#000000';
        }
    });
</script>
</body>
</html>
